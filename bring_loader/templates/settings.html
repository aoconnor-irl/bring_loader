{% extends 'base.html' %}{% block body %}<h1>Bring! settings</h1><p>One shared Bring! account and destination list. The saved password is encrypted and never shown here.</p><form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Bring! email<input type="email" name="email" value="{{ email }}" required autocomplete="username"></label><label>Bring! password<input type="password" name="password" placeholder="{% if configured %}Leave blank to keep saved password{% else %}Enter password{% endif %}" autocomplete="new-password"></label><button>Save account</button></form><div class="card"><p>Selected list: <strong>{{ selected or 'None yet' }}</strong></p>{% if email and configured %}<form method="post" action="{{ url_for('list_choices') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="secondary">Connect and choose list</button></form>{% endif %}</div>{% endblock %}
