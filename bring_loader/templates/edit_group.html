{% extends 'base.html' %}{% block body %}<p><a href="{{ url_for('groups') }}">← Groups</a></p><h1>{{ group.name }}</h1><form class="card" method="post" action="{{ url_for('rename_group',group_id=group.id) }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Group name<input name="name" value="{{ group.name }}" required></label><button>Rename</button></form><h2>Items in this group</h2>{% for entry in entries %}<form class="card item-form" method="post" action="{{ url_for('edit_group_item',group_id=group.id,entry_id=entry.id) }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><strong>{{ entry.name }}</strong><div class="inline"><label>Quantity<input name="quantity" type="number" min="0.001" step="any" value="{{ entry.quantity }}" required></label><span>{{ entry.unit }}</span><button>Save</button><button class="danger secondary" name="action" value="delete" formnovalidate onclick="return confirm('Remove this item from the group?')">Remove</button></div></form>{% else %}<p>No items yet.</p>{% endfor %}
<h2>Add an item</h2><form class="card" method="post" action="{{ url_for('add_group_item',group_id=group.id) }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Catalogue item<select name="item_id" required><option value="">Select an item</option>{% for item in items %}<option value="{{ item.id }}">{{ item.name }}{% if item.unit %} ({{ item.unit }}){% endif %}</option>{% endfor %}</select></label><label>Quantity<input name="quantity" type="number" min="0.001" step="any" required></label><button>Add to group</button><p><a href="{{ url_for('items') }}">Need a new catalogue item? Create it here.</a></p></form><form method="post" action="{{ url_for('delete_group',group_id=group.id) }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="danger secondary" onclick="return confirm('Delete this group and its entries?')">Delete group</button></form>{% endblock %}
