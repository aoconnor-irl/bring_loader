{% extends 'base.html' %}{% block body %}<h1>Item catalogue</h1><p>Each item has one usual unit. Select existing items when building groups so quantities combine.</p><form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Item name<input name="name" required placeholder="e.g. Onion"></label><label>Unit (optional)<input name="unit" placeholder="e.g. g, ml, cloves, bag"></label><button>Add item</button></form><div class="stack">{% for item in items %}<a class="card row-link" href="{{ url_for('edit_item',item_id=item.id) }}"><span>{{ item.name }} <small>{{ item.unit or 'count' }} · {{ item.uses }} groups</small></span><span>›</span></a>{% endfor %}</div>{% endblock %}
