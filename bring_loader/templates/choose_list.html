{% extends 'base.html' %}{% block body %}<h1>Choose a Bring! list</h1><form method="post" action="{{ url_for('select_list') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><div class="stack">{% for uuid,name in lists %}<label class="card radio"><input type="radio" name="list_uuid" value="{{ uuid }}" {% if uuid==selected %}checked{% endif %} required> {{ name }}</label>{% else %}<p>No lists found for this account.</p>{% endfor %}</div>{% if lists %}<button>Use selected list</button>{% endif %}</form>{% endblock %}
