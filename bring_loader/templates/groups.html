{% extends 'base.html' %}{% block body %}<h1>Groups</h1><p>A group can be a meal, bathroom restock, or any recurring shopping set.</p><form class="card" method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>New group name<input name="name" required placeholder="e.g. Cleaning supplies"></label><button>Create group</button></form><div class="stack">{% for group in groups %}<a class="card row-link" href="{{ url_for('edit_group',group_id=group.id) }}">{{ group.name }} <span>›</span></a>{% endfor %}</div>{% endblock %}
